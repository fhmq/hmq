name: hmq-local
x-broker: &broker
  image: ${HMQ_COMPOSE_IMAGE:-hmq-local:compose}
  build:
    context: ../..
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully
  stop_grace_period: 15s
services:
  init:
    image: golang:1.27.4
    working_dir: /src
    command: [go, run, -buildvcs=false, ./deploy/compose/setup, /runtime]
    volumes:
      - ../..:/src:ro
      - runtime:/runtime
  single:
    <<: *broker
    profiles: [single]
    command: [--config, /runtime/single.json]
    ports: ["127.0.0.1:${HMQ_SINGLE_MQTT_PORT:-11883}:1883", "127.0.0.1:${HMQ_SINGLE_HTTP_PORT:-18080}:8080"]
    volumes: ["runtime:/runtime:ro", "single-data:/data"]
  a:
    <<: *broker
    profiles: [cluster]
    command: [--config, /runtime/a.json]
    ports: ["127.0.0.1:${HMQ_A_MQTT_PORT:-21883}:1883", "127.0.0.1:${HMQ_A_HTTP_PORT:-28080}:8080"]
    volumes: ["runtime:/runtime:ro", "a-data:/data"]
  b:
    <<: *broker
    profiles: [cluster]
    command: [--config, /runtime/b.json]
    ports: ["127.0.0.1:${HMQ_B_MQTT_PORT:-31883}:1883", "127.0.0.1:${HMQ_B_HTTP_PORT:-38080}:8080"]
    volumes: ["runtime:/runtime:ro", "b-data:/data"]
  c:
    <<: *broker
    profiles: [cluster]
    command: [--config, /runtime/c.json]
    ports: ["127.0.0.1:${HMQ_C_MQTT_PORT:-41883}:1883", "127.0.0.1:${HMQ_C_HTTP_PORT:-48080}:8080"]
    volumes: ["runtime:/runtime:ro", "c-data:/data"]
volumes:
  runtime:
  single-data:
  a-data:
  b-data:
  c-data:
