name: Compose integration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Validate Compose
        run: docker compose -f deploy/compose/compose.yaml --profile single --profile cluster config --quiet
      - name: Start local brokers
        run: docker compose -f deploy/compose/compose.yaml --profile single --profile cluster up -d --build
      - name: Functional and quorum lifecycle tests
        env:
          HMQ_COMPOSE_TEST: '1'
        run: go test -race -v -count=1 -timeout=10m ./deploy/compose/e2e
      - name: Diagnostics
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml --profile single --profile cluster ps -a
          docker compose -f deploy/compose/compose.yaml --profile single --profile cluster logs --tail=100
      - name: Stop test deployment
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --profile single --profile cluster down
